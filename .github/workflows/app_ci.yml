name: App CI & Release

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/app_ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Run Flutter Unit Tests
        working-directory: ./app
        run: flutter test

      - name: Build APK (Release)
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: ./app
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            flutter build apk --release --build-number=${{ github.run_number }}
            flutter build appbundle --release --build-number=${{ github.run_number }}
          else
            echo "Signing secrets missing, building unsigned/debug-signed APK and AAB"
            flutter build apk --release --build-number=${{ github.run_number }}
            flutter build appbundle --release --build-number=${{ github.run_number }}
          fi

      - name: Rename Build Artifacts
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk app/build/app/outputs/flutter-apk/BromBrom.apk
          mv app/build/app/outputs/bundle/release/app-release.aab app/build/app/outputs/bundle/release/BromBrom.aab

      - name: Upload Build Artifacts
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: BromBrom-Android-Builds
          path: |
            app/build/app/outputs/flutter-apk/BromBrom.apk
            app/build/app/outputs/bundle/release/BromBrom.aab

      - name: Push APK to Latest Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading APK to 'stable' release..."
          gh release upload stable app/build/app/outputs/flutter-apk/BromBrom.apk --clobber || echo "Release 'stable' not found yet. Map build will create it."

