name: Build and Release BromBrom

on:
  push:
    branches: [ fix/ci-zero-downtime ]
  schedule:
    - cron: '0 0 2 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build -t brombrom-builder . --load

      - name: Run Build Pipeline
        run: |
          docker run --rm -v ${{ github.workspace }}:/app --memory="6g" brombrom-builder

      - name: Zero-Downtime Release Update (TEST)
        run: |
          # 1. Force move the test tag
          git tag -f test-release
          git push origin test-release -f
          
          # 2. Update Metadata (Ensure release exists or edit it)
          gh release create test-release --title "Test Build" --notes "Testing Downtime" || \
          gh release edit test-release --title "Latest BromBrom OsmAnd Build (Test)" --notes "Tested on $(date)"
          
          # 3. Upload and Overwrite (The Clobber)
          gh release upload test-release \
            dist/routing.xml \
            dist/NL_BromBrom_tagged.obf \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
