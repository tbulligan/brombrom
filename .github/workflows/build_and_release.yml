name: Build and Release BromBrom

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'run_full_build.sh'
      - '.github/workflows/build_and_release.yml'
  schedule:
    - cron: '0 5 * * 1' # Weekly on Mondays at 05:00 UTC (07:00 CET/CEST)
  workflow_dispatch:   # Allow manual trigger
    inputs:
      force_fresh:
        description: 'Force fresh download of OSM and NDW data (bypass cache)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Get current date and month
        id: date
        run: |
          echo "year_month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Get OSM MD5
        id: osm_md5
        run: |
          MD5=$(curl -fsS --connect-timeout 15 --retry 3 https://download.geofabrik.de/europe/netherlands-latest.osm.pbf.md5 | awk '{print $1}')
          if [ -z "$MD5" ]; then
            echo "Error: Failed to fetch MD5 from Geofabrik." >&2
            exit 1
          fi
          echo "hash=$MD5" >> $GITHUB_OUTPUT

      - name: Restore OSM Map Data Cache
        id: cache-osm
        if: github.event.inputs.force_fresh != 'true'
        uses: actions/cache/restore@v6
        with:
          path: nl_map.osm.pbf
          key: osm-pbf-${{ steps.osm_md5.outputs.hash }}

      - name: Restore NDW Traffic Sign Data Cache
        id: cache-ndw
        if: github.event.inputs.force_fresh != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ndw_c9_current_state.json
          key: ndw-c9-${{ steps.date.outputs.year_month }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        run: |
          docker buildx build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t brombrom-builder . --load

      - name: Run Build Pipeline
        run: |
          # The runner has ~7GB physical RAM. We stay at 6GB to avoid swap/OOM.
          docker run --rm -v ${{ github.workspace }}:/app --memory="6g" brombrom-builder

      - name: Save OSM Map Data Cache
        if: steps.cache-osm.outputs.cache-hit != 'true' && steps.osm_md5.outputs.hash != ''
        uses: actions/cache/save@v6
        with:
          path: nl_map.osm.pbf
          key: osm-pbf-${{ steps.osm_md5.outputs.hash }}

      - name: Save NDW Traffic Sign Data Cache
        if: steps.cache-ndw.outputs.cache-hit != 'true' && steps.date.outputs.year_month != ''
        uses: actions/cache/save@v6
        with:
          path: ndw_c9_current_state.json
          key: ndw-c9-${{ steps.date.outputs.year_month }}

      - name: Generate Release Tag
        id: tag
        run: echo "TAG_NAME=build-$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Zero-Downtime Release Update
        run: |
          # 1. Force move the 'stable' tag locally and on remote
          git tag -f stable
          git push origin stable -f
          
          # 2. Define release notes (backticks escaped because it's inside double quotes)
          NOTES="## Automated Weekly Build
          This release contains the latest map data and routing profiles for microcars in the Netherlands.
          
          **Installation Instructions (Android - Recommended)**: 
          1. Download the **BromBrom Manager App** directly on the [Google Play Store](https://play.google.com/store/apps/details?id=com.brombrom.app).
          2. Open the app and follow the layout prompts to install or update the BromBrom logic and maps in OsmAnd.
          *(Note: You can still download the standalone \`BromBrom.apk\` below if you prefer manual sideloading).*
          
          **Installation Instructions (iOS / Manual)**:
          1. Ensure you have the free OsmAnd app installed.
          2. Download the **BromBrom.osf** package below.
          3. Tap the downloaded file to open it in OsmAnd. Check both \"Settings\" and \"Resources\" on the prompt, then select Apply (or Replace All) to finish the import.
          
          [Full Installation Guide](https://github.com/tbulligan/brombrom/blob/main/docs/manual_install.md)
          
          **Build Date**: ${{ steps.tag.outputs.TAG_NAME }}
          **Base Branch**: ${{ github.ref_name }}"
          
          # 3. Ensure release exists and update metadata
          gh release edit stable --title "Latest BromBrom Build" --notes "$NOTES" || \
          gh release create stable --title "Latest BromBrom Build" --notes "$NOTES"
          
          # 4. Upload unified OSF package
          echo "Uploading BromBrom.osf to stable release..."
          gh release upload stable dist/BromBrom.osf --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}