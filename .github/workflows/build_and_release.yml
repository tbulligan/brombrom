name: Build and Release BromBrom

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'assets/**'
      - 'LICENSE'
  schedule:
    - cron: '0 0 2 * *' # Monthly on the 2nd at midnight
  workflow_dispatch:   # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build -t brombrom-builder . --load

      - name: Run Build Pipeline
        run: |
          # The runner has ~7GB physical RAM. We stay at 6GB to avoid swap/OOM.
          docker run --rm -v ${{ github.workspace }}:/app --memory="6g" brombrom-builder

      - name: Zero-Downtime Release Update
        run: |
          # 1. Force move the 'latest' tag to the current commit locally and on remote
          git tag -f latest
          git push origin latest -f
          
          # 2. Update the release metadata and upload artifacts with --clobber
          # This overwrites existing files in-place, avoiding a 404 window.
          gh release upload latest \
            dist/routing.xml \
            dist/NL_BromBrom_tagged.obf \
            --clobber \
            --name "Latest BromBrom OsmAnd Build" \
            --body "## Automated Monthly Build
            This release contains the latest map data and routing profiles for microcars in the Netherlands.

            **Installation Instructions**: 
            1. Download both files below.
            2. Follow the Quick Way instructions in the [README](https://github.com/tbulligan/brombrom#installation--setup).

            **Build Date**: build-$(date +'%Y-%m-%d')
            **Base Branch**: ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
