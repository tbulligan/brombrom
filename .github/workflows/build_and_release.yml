name: Build and Release BromBrom

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'run_full_build.sh'
      - '.github/workflows/build_and_release.yml'
  schedule:
    - cron: '0 0 2 * *' # Monthly on the 2nd at midnight
  workflow_dispatch:   # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build -t brombrom-builder . --load

      - name: Run Build Pipeline
        run: |
          # The runner has ~7GB physical RAM. We stay at 6GB to avoid swap/OOM.
          docker run --rm -v ${{ github.workspace }}:/app --memory="6g" brombrom-builder

      - name: Generate Release Tag
        id: tag
        run: echo "TAG_NAME=build-$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Zero-Downtime Release Update
        run: |
          # 1. Force move the 'latest' tag locally and on remote
          git tag -f latest
          git push origin latest -f
          
          # 2. Ensure release exists and update metadata
          gh release edit latest \
            --title "Latest BromBrom OsmAnd Build" \
            --notes "## Automated Monthly Build
            This release contains the latest map data and routing profiles for microcars in the Netherlands.

            **Installation Instructions**: 
            1. Download both files below.
            2. Follow the Quick Way instructions in the [README](https://github.com/tbulligan/brombrom#installation--setup).

            **Build Date**: ${{ steps.tag.outputs.TAG_NAME }}
            **Base Branch**: ${{ github.ref_name }}" || \
          gh release create latest \
            --title "Latest BromBrom OsmAnd Build" \
            --notes "Initial release setup."

          # 3. Upload and Overwrite artifacts (Zero-Downtime)
          gh release upload latest \
            dist/routing.xml \
            dist/NL_BromBrom_tagged.obf \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
