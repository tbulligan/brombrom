name: Build and Release BromBrom

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '!config/routing.xml'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'run_full_build.sh'
      - '.github/workflows/build_and_release.yml'
  schedule:
    - cron: '0 0 2 * *' # Monthly on the 2nd at midnight
  workflow_dispatch:   # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build -t brombrom-builder . --load

      - name: Run Build Pipeline
        run: |
          # The runner has ~7GB physical RAM. We stay at 6GB to avoid swap/OOM.
          docker run --rm -v ${{ github.workspace }}:/app --memory="6g" brombrom-builder

      - name: Generate Release Tag
        id: tag
        run: echo "TAG_NAME=build-$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Zero-Downtime Release Update
        run: |
          # 1. Force move the 'latest' tag locally and on remote
          git tag -f latest
          git push origin latest -f
          
          # 2. Define release notes
          NOTES="## Automated Monthly Build
          This release contains the latest map data and routing profiles for microcars in the Netherlands.

          **Installation Instructions (Android - Recommended)**: 
          1. Download and install **BromBrom.apk** below.
          2. Open the app and tap **UPDATE MAP** and **UPDATE BromBrom Routing**.

          **Installation Instructions (iOS / Manual)**:
          Follow the [Manual Install Guide](https://github.com/tbulligan/brombrom/blob/main/docs/manual_install.md).

          **Build Date**: ${{ steps.tag.outputs.TAG_NAME }}
          **Base Branch**: ${{ github.ref_name }}"

          # 3. Ensure release exists and update metadata
          gh release edit latest --title "Latest BromBrom OsmAnd Build" --notes "$NOTES" || \
          gh release create latest --title "Latest BromBrom OsmAnd Build" --notes "$NOTES"

          # 4. Conditional routing.xml update
          # Download current routing.xml to compare
          gh release download latest -p "routing.xml" -O existing_routing.xml --clobber 2>/dev/null || touch existing_routing.xml
          
          if cmp -s existing_routing.xml dist/routing.xml; then
            echo "routing.xml is unchanged, uploading map only."
            gh release upload latest \
              dist/NL_BromBrom_tagged.obf \
              --clobber
          else
            echo "routing.xml changed, uploading both."
            gh release upload latest \
              dist/routing.xml \
              dist/NL_BromBrom_tagged.obf \
              --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
