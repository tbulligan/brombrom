name: Build and Release BromBrom

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'assets/**'
      - 'LICENSE'
  schedule:
    - cron: '0 0 2 * *' # Monthly on the 2nd at midnight
  workflow_dispatch:   # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build -t brombrom-builder . --load

      - name: Run Build Pipeline
        run: |
          # The runner has ~7GB physical RAM. We stay at 6GB to avoid swap/OOM.
          docker run --rm -v ${{ github.workspace }}:/app --memory="6g" brombrom-builder

      - name: Generate Release Tag
        id: tag
        run: echo "TAG_NAME=build-$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Clear Old Release Assets
        run: |
          # List all assets for the 'latest' release and delete them one by one
          assets=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          for asset in $assets; do
            echo "Deleting old asset: $asset"
            gh release delete-asset latest "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/routing.xml
            dist/NL_BromBrom_tagged.obf
          tag_name: latest
          name: Latest BromBrom OsmAnd Build
          body: |
            ## Automated Monthly Build
            This release contains the latest map data and routing profiles for microcars in the Netherlands.

            **Installation Instructions**: 
            1. Download both files below.
            2. Follow the Quick Way instructions in the [README](https://github.com/tbulligan/brombrom#installation--setup).

            **Build Date**: ${{ steps.tag.outputs.TAG_NAME }}
            **Base Branch**: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
