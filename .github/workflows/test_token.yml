name: Test Release Token

on:
  workflow_dispatch:

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify Token Permissions
        run: |
          echo "Checking Github CLI status with RELEASE_TOKEN..."
          gh auth status
          echo "---"
          echo "Listing releases to verify read/write access..."
          gh release list
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
